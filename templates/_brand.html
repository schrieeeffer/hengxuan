{% macro brand_mark(size='md') -%}
<svg class="brand-symbol brand-symbol-{{ size }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <rect class="brand-symbol__ground" x="1" y="1" width="30" height="30" rx="7"></rect>
  <path class="brand-symbol__glyph" d="M9 8.5v15M23 8.5v15M9 16h5m0 0 3 3 6-7"></path>
</svg>
{%- endmacro %}

{% macro brand_logo(size='md', show_descriptor=false) -%}
<span class="brand-logo brand-logo-{{ size }}">
  {{ brand_mark(size) }}
  <span class="brand-logo__copy">
    <strong class="brand-logo__name">衡选</strong>
    {% if show_descriptor %}<small class="brand-logo__descriptor">多人协作评分</small>{% endif %}
  </span>
</span>
{%- endmacro %}
