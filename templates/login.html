{% extends "base.html" %}
{% block title %}衡选 · 登录{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-layout">
  {% include "_auth_header.html" %}

  <section class="auth-panel" aria-labelledby="login-title">
    <header class="auth-panel__heading">
      <h1 id="login-title">欢迎回来</h1>
      <p>登录后继续进入你的评审房间。</p>
    </header>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-field">
        <label for="username">账号名</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="20" required autofocus placeholder="请输入账号名" value="{{ request.form.get('username', '') }}">
      </div>
      <div class="auth-field">
        <div class="auth-field__heading">
          <label for="password">密码</label>
          <a href="{{ url_for('forgot_password') }}">忘记密码？</a>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="请输入密码">
      </div>
      <button type="submit" class="primary-button">登录</button>
    </form>
    <p class="auth-switch">还没有账号？<a href="{{ url_for('register') }}">创建账号</a></p>
  </section>

  <p class="auth-product-note">多人协作评分与选拔工具</p>
</main>
{% endblock %}
