{% extends "base.html" %}

{% block title %}衡选 · 找回账号{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-layout auth-layout--recovery">
  {% include "_auth_header.html" %}

  <section class="auth-panel" aria-labelledby="recovery-title">
    <a class="auth-back-link" href="{{ url_for('login') }}">← 返回登录</a>
    <header class="auth-panel__heading">
      <h1 id="recovery-title">找回账号</h1>
      <p>使用账号恢复码，或管理员提供的临时重置码设置新密码。</p>
    </header>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-field">
        <label for="username">账号名</label>
        <input id="username" name="username" maxlength="20" autocomplete="username" required autofocus placeholder="请输入账号名" value="{{ request.form.get('username', '') }}">
      </div>
      <div class="auth-field">
        <label for="recovery_code">恢复码或临时重置码</label>
        <input id="recovery_code" name="recovery_code" maxlength="128" autocomplete="one-time-code" required placeholder="请输入恢复码">
      </div>
      <div class="auth-field">
        <label for="password">新密码</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required placeholder="至少 6 位">
      </div>
      <div class="auth-field">
        <label for="confirm_password">确认新密码</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required placeholder="再次输入密码">
      </div>
      <button class="primary-button" type="submit">重置密码</button>
    </form>
    <p class="auth-security-note">重置后，旧恢复码和其他设备上的登录会失效，并生成新的恢复码。</p>
  </section>

  <p class="auth-product-note">多人协作评分与选拔工具</p>
</main>
{% endblock %}
